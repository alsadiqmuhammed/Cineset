plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables so the keystore never lives in the repo.
// Keep the same keystore for every release: Android only installs an update over an app
// signed with the same key, and reinstalling would delete the data stored on the phone.
def keystorePath = System.getenv('CINESET_KEYSTORE')

android {
    namespace 'app.cineset.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'app.cineset.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2.0.0'
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('CINESET_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CINESET_KEY_ALIAS') ?: 'cineset'
                keyPassword System.getenv('CINESET_KEY_PASSWORD') ?: System.getenv('CINESET_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
