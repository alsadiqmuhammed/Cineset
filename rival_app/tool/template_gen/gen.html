const img=s=>cache[s]||(cache[s]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=A+s;}));
const TOOTH=[[0.5,0.12],[0.38,0,0.05,0,0.04,0.28],[0.03,0.5,0.15,0.62,0.2,0.8],[0.24,0.96,0.33,1,0.36,0.9],[0.4,0.78,0.43,0.64,0.5,0.64],[0.57,0.64,0.6,0.78,0.64,0.9],[0.67,1,0.76,0.96,0.8,0.8],[0.85,0.62,0.97,0.5,0.96,0.28],[0.95,0,0.62,0,0.5,0.12]];
const DROP=[[0.5,0],[0.62,0.2,1,0.45,1,0.68],[1,0.88,0.78,1,0.5,1],[0.22,1,0,0.88,0,0.68],[0,0.45,0.38,0.2,0.5,0]];
function unit(ctx,d,x,y,w,h){ctx.beginPath();ctx.moveTo(x+d[0][0]*w,y+d[0][1]*h);for(const c of d.slice(1))ctx.bezierCurveTo(x+c[0]*w,y+c[1]*h,x+c[2]*w,y+c[3]*h,x+c[4]*w,y+c[5]*h);ctx.closePath();}
function path(ctx,s,x,y,w,h){ // s: {shape, radius}
  if(s.shape==='oval'){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);}
  else if(s.shape==='tooth')unit(ctx,TOOTH,x,y,w,h);
  else if(s.shape==='drop')unit(ctx,DROP,x,y,w,h);
  else if(s.shape==='arch'){const r=w/2;ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x,y+r);ctx.arc(x+r,y+r,r,Math.PI,0);ctx.lineTo(x+w,y+h);ctx.closePath();}
  else{ctx.beginPath();ctx.roundRect(x,y,w,h,s.radius||0);}
}
function softCut(ctx,x,y,w,h,b){ctx.save();ctx.globalCompositeOperation='destination-out';ctx.filter=`blur(${b}px)`;ctx.fillStyle='#000';ctx.fillRect(x+b,y+b,w-2*b,h-2*b);ctx.restore();}
function cut(ctx,fn){ctx.save();ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';fn();ctx.fill();ctx.restore();}
function star(ctx,cx,cy,r,col){const k=r*0.22;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(cx,cy-r);ctx.quadraticCurveTo(cx+k,cy-k,cx+r,cy);ctx.quadraticCurveTo(cx+k,cy+k,cx,cy+r);ctx.quadraticCurveTo(cx-k,cy+k,cx-r,cy);ctx.quadraticCurveTo(cx-k,cy-k,cx,cy-r);ctx.fill();}
function text(ctx,t,x,y,font,col,align='center'){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.direction='rtl';ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function latin(ctx,t,x,y,font,col,sp='6px',align='center'){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.direction='ltr';ctx.letterSpacing=sp;ctx.textBaseline='middle';ctx.fillText(t,x,y);ctx.letterSpacing='0px';}
async function logo(ctx,name,cx,y,h){const l=await img(name);const w=l.width*h/l.height;ctx.drawImage(l,cx-w/2,y,w,h);return w;}
function vgrad(ctx,y0,y1,col,a0,a1){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,rgba(col,a0));g.addColorStop(1,rgba(col,a1));ctx.fillStyle=g;ctx.fillRect(0,Math.min(y0,y1),ctx.canvas.width,Math.abs(y1-y0));}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function glow(ctx,x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
function shadowFill(ctx,fn,col,blur,oy,fill){ctx.save();ctx.shadowColor=col;ctx.shadowBlur=blur;ctx.shadowOffsetY=oy;ctx.fillStyle=fill;fn();ctx.fill();ctx.restore();}
function arrow(ctx,x1,y1,cx,cy,x2,y2,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();const a=Math.atan2(y2-cy,x2-cx),h=w*5;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a-0.45),y2-h*Math.sin(a-0.45));ctx.moveTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a+0.45),y2-h*Math.sin(a+0.45));ctx.stroke();}
function bgFill(ctx,W,H,p){ctx.fillStyle=p.bg;ctx.fillRect(0,0,W,H);glow(ctx,W*0.95,0,W*0.8,p.glowA,p.dark?0.22:0.45);glow(ctx,0,H,W*0.9,p.glowB,p.dark?0.35:0.14);}

const PAL={
 dental:{

  D:{name:'ليلي',dark:true,bg:'#181212',paper:'#2A2220',ink:'#F4F1EC',muted:'#CFC4B8',accent:'#E8673F',accent2:'#D33C1A',gold:'#DBB686',glowA:'#DBB686',glowB:'#D33C1A',logo:'logo_reversed.png',stack:'logo_reversed.png',sym:'symbol.png',horiz:false}},
 beauty:{
  L:{name:'وردي',dark:false,bg:'#F6EEE8',paper:'#FFFFFF',ink:'#3A0712',muted:'#8A6B70',accent:'#9C3D4E',accent2:'#5A0E1E',gold:'#B8894C',glowA:'#9C3D4E',glowB:'#DBB686',logo:'beauty_horizontal.png',stack:'beauty_primary.png',sym:'beauty_symbol.png',horiz:true},
  D:{name:'نبيذي',dark:true,bg:'#2A0710',paper:'#3D0E1A',ink:'#F6EEE8',muted:'#E3CBD0',accent:'#E8A0AE',accent2:'#9C3D4E',gold:'#DBB686',glowA:'#DBB686',glowB:'#9C3D4E',logo:'beauty_reversed.png',stack:'beauty_reversed.png',sym:'beauty_symbol_reversed.png',horiz:false}}
};

 dental:{brand:'عيادة ريڤال',latin:'RIVAL CLINIC',tags:['ابتسامة جديدة','الفرق واضح','نتيجة حقيقية','ابتسامتك تبدأ من هنا','ابتسامة تليق بيك'],shape:'tooth'},
 beauty:{brand:'ريڤال بيوتي',latin:'RIVAL BEAUTY',tags:['جمال طبيعي','نتيجة حقيقية','لمسة أنعم','إشراقة جديدة','لأن الجمال تفاصيل'],shape:'drop'}

async function brandLogo(ctx,g,cx,y,h){const p=g.p;return logo(ctx,p.horiz?p.logo:p.stack,cx,y,p.horiz?h:h*2.2);}
function logoH(g,h){return g.p.horiz?h:h*2.2;}

const F={};

// ١ دمج عمودي: نفس الوجه، اليمين قبل واليسار بعد بتدرّج ناعم
F.blend={name:'دمج',async draw(ctx,g){const {W,H,p,t}=g;
  ctx.clearRect(0,0,W,H);
  const top=g.fmt==='story'?0.24:0.2, bot=g.fmt==='story'?0.26:0.27;
  vgrad(ctx,H*top*0.45,H*top,p.bg,1,0); vgrad(ctx,H*(1-bot*0.45),H*(1-bot),p.bg,1,0);
  ctx.fillStyle=p.bg;ctx.fillRect(0,0,W,H*top*0.45);ctx.fillRect(0,H*(1-bot*0.45),W,H*bot*0.45);
  await brandLogo(ctx,g,W/2,g.fmt==='story'?120:46,g.fmt==='square'?52:62);
  const ly=H*(1-bot*0.62);
  text(ctx,'قبل',W*0.8,ly,'60px Ruqaa',p.accent);text(ctx,'بعد',W*0.2,ly,'60px Ruqaa',p.accent);
  ctx.strokeStyle=rgba(p.gold,0.8);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*0.36,ly);ctx.lineTo(W*0.64,ly);ctx.stroke();star(ctx,W/2,ly,12,p.gold);
  text(ctx,t.tags[g.v%5],W/2,H-(g.fmt==='story'?170:70),'800 34px Almarai',p.ink);
  const full=[0,0,W,H];
  return {slots:[full,full],masks:[null,{fadeFrom:[1,0],fadeTo:[-1,0],fadeStart:0.4,fadeEnd:0.6}],baked:true,background:true};
}};
// ٢ دمج قطري
F.diag={name:'دمج قطري',async draw(ctx,g){const {W,H,p,t}=g;
  ctx.clearRect(0,0,W,H);
  vgrad(ctx,H,H*0.62,p.bg,0.96,0);
  await brandLogo(ctx,g,W*0.5,g.fmt==='story'?130:50,g.fmt==='square'?48:58);
  ctx.save();ctx.globalCompositeOperation='destination-over';ctx.restore();
  text(ctx,'قبل',W-90,g.fmt==='story'?420:250,'64px Ruqaa',p.dark?p.ink:'#FFFFFF','right');
  text(ctx,'بعد',90,H-(g.fmt==='story'?300:200),'64px Ruqaa',p.accent,'left');
  text(ctx,t.tags[(g.v+1)%5],W-90,H-(g.fmt==='story'?300:200),'800 36px Almarai',p.ink,'right');
  latin(ctx,t.latin,W-90,H-(g.fmt==='story'?240:145),'800 20px Almarai',p.gold,'6px','right');
  const full=[0,0,W,H];
  return {slots:[full,full],masks:[null,{fadeFrom:[1,-1],fadeTo:[-1,1],fadeStart:0.42,fadeEnd:0.58}],baked:true,background:true};
}};
// ٣ ذوبان فوق بعض: كل صورة كاملة وتذوب بالثانية
F.melt={name:'ذوبان',async draw(ctx,g){const {W,H,p,t}=g;
  ctx.clearRect(0,0,W,H);
  const side=g.fmt!=='story'&&g.fmt!=='post';
  const head=g.fmt==='story'?300:g.fmt==='post'?190:150, foot=g.fmt==='story'?330:g.fmt==='post'?180:140;
  ctx.fillStyle=p.bg;ctx.fillRect(0,0,W,head);ctx.fillRect(0,H-foot,W,foot);
  vgrad(ctx,head,head+90,p.bg,1,0);vgrad(ctx,H-foot,H-foot-90,p.bg,1,0);
  await brandLogo(ctx,g,W/2,g.fmt==='story'?140:(head-logoH(g,54))/2,54);
  text(ctx,t.tags[(g.v+2)%5],W/2,H-foot/2-14,'60px Ruqaa',p.accent);
  latin(ctx,t.latin,W/2,H-foot/2+44,'800 20px Almarai',p.gold,'7px');
  let s0,s1,m;
  if(side){s0=[W*0.42,head,W*0.58,H-head-foot];s1=[0,head,W*0.58,H-head-foot];m={fadeFrom:[1,0],fadeTo:[-1,0],fadeStart:0,fadeEnd:0.28};
    text(ctx,'قبل',W-60,head+60,'800 30px Almarai',p.dark?p.ink:'#FFFFFF','right');text(ctx,'بعد',60,head+60,'800 30px Almarai','#FFFFFF','left');}
  else{const a=H-head-foot;s0=[0,head,W,a*0.58];s1=[0,head+a*0.42,W,a*0.58];m={fadeFrom:[0,-1],fadeTo:[0,1],fadeStart:0,fadeEnd:0.28};
    pill(ctx,'قبل',W-80,head+60,p.ink,p.bg,'right');pill(ctx,'بعد',W-80,H-foot-60,p.accent,'#FFFFFF','right');}
  return {slots:[s0,s1],masks:[null,m],baked:true,background:true};
}};
function pill(ctx,t,x,y,bg,fg,align){ctx.font='800 30px Almarai';const w=ctx.measureText(t).width+56;const x0=align==='right'?x-w:x;ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x0,y-28,w,56,28);ctx.fill();text(ctx,t,x0+w/2,y+2,'800 30px Almarai',fg);}
// ٤ ضباب: صورتين جنب بعض تذوبن بالخلفية
F.mist={name:'ضباب',async draw(ctx,g){const {W,H,p,t}=g;
  bgFill(ctx,W,H,p);
  const top=g.fmt==='story'?420:g.fmt==='post'?270:220, bot=g.fmt==='story'?1500:g.fmt==='post'?1080:850;
  await brandLogo(ctx,g,W/2,g.fmt==='story'?150:70,58);
  cut(ctx,()=>{ctx.beginPath();ctx.rect(20,top-40,W-40,bot-top+80);});
  // تدرّج داخل الفتحة حتى الحد يختفي
  ctx.save();ctx.beginPath();ctx.rect(20,top-40,W-40,bot-top+80);ctx.clip();
  vgrad(ctx,top-40,top+40,p.bg,1,0);vgrad(ctx,bot+40,bot-40,p.bg,1,0);
  const lg=ctx.createLinearGradient(20,0,110,0);lg.addColorStop(0,rgba(p.bg,1));lg.addColorStop(1,rgba(p.bg,0));ctx.fillStyle=lg;ctx.fillRect(20,top-40,90,bot-top+80);
  const rg=ctx.createLinearGradient(W-20,0,W-110,0);rg.addColorStop(0,rgba(p.bg,1));rg.addColorStop(1,rgba(p.bg,0));ctx.fillStyle=rg;ctx.fillRect(W-110,top-40,90,bot-top+80);
  ctx.restore();
  const y=bot+(H-bot)/2;
  text(ctx,'قبل',W*0.73,bot-50,'58px Ruqaa',p.dark?p.ink:'#FFFFFF');text(ctx,'بعد',W*0.27,bot-50,'58px Ruqaa','#FFFFFF');
  text(ctx,t.tags[(g.v+3)%5],W/2,y-16,'800 40px Almarai',p.ink);
  latin(ctx,t.latin,W/2,y+40,'800 20px Almarai',p.gold,'7px');
  return {slots:[[W*0.47,top,W*0.53,bot-top],[0,top,W*0.53,bot-top]],masks:[{feather:26},{feather:26,fadeFrom:[1,0],fadeTo:[0.7,0],fadeStart:0,fadeEnd:1}],baked:true,background:true};
}};
// ٥ هالة: صورة وحدة تذوب بالخلفية
F.halo={name:'هالة',single:true,async draw(ctx,g){const {W,H,p,t}=g;
  ctx.clearRect(0,0,W,H);
  const top=g.fmt==='story'?330:200, bot=g.fmt==='story'?1560:g.fmt==='post'?1090:860;
  // الخلفية كلها بلون واحد والصورة بالنص تذوب
  ctx.fillStyle=p.bg;ctx.fillRect(0,0,W,top);ctx.fillRect(0,bot,W,H-bot);
  vgrad(ctx,top,top+140,p.bg,1,0);vgrad(ctx,bot,bot-160,p.bg,1,0);
  await brandLogo(ctx,g,W/2,g.fmt==='story'?140:60,56);
  const y=bot+(H-bot)/2;
  text(ctx,t.tags[g.v%5],W/2,y-14,'64px Ruqaa',p.accent);
  latin(ctx,t.latin,W/2,y+48,'800 20px Almarai',p.gold,'8px');
  return {slots:[[60,top-60,W-120,bot-top+120]],masks:[{feather:40,shape:'rect',radius:80}],baked:false,background:true};
}};
// ٦ بولارويد بشريط لاصق
F.polaroid={name:'بولارويد',async draw(ctx,g){const {W,H,p,t}=g;
  bgFill(ctx,W,H,p);
  const story=g.fmt==='story',sq=g.fmt==='square';
  let cards;
  if(sq){cards=[{x:560,y:200,w:420,h:600,r:3},{x:100,y:240,w:420,h:600,r:-3}];}
  else{const cw=story?560:470,ch=story?650:540;const x=W-cw-70;cards=[{x,y:story?240:120,w:cw,h:ch,r:2},{x,y:story?960:690,w:cw,h:ch,r:-2}];}
  const slots=[];
  for(const [i,c] of cards.entries()){
    ctx.save();ctx.translate(c.x+c.w/2,c.y+c.h/2);ctx.rotate(c.r*Math.PI/180);
    shadowFill(ctx,()=>{ctx.beginPath();ctx.rect(-c.w/2,-c.h/2,c.w,c.h);},'rgba(40,20,10,0.28)',30,12,p.dark?'#F4F1EC':'#FFFFFF');
    const pad=26,ph=c.h-pad-110;
    ctx.save();ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';ctx.fillRect(-c.w/2+pad,-c.h/2+pad,c.w-2*pad,ph);ctx.restore();
    text(ctx,i===0?'قبل':'بعد',0,c.h/2-58,'800 36px Almarai','#231F20');
    ctx.fillStyle='rgba(236,230,214,0.82)';ctx.save();ctx.rotate(-0.04);ctx.fillRect(-90,-c.h/2-26,180,52);ctx.restore();
    ctx.restore();
    // صندوق الشباك (يحيط الفتحة المايلة)
    const hw=(c.w-2*26)/2,hh=(c.h-26-110)/2,cy=c.y+c.h/2+(-c.h/2+26+hh),cx=c.x+c.w/2;const a=Math.abs(c.r*Math.PI/180);
    const bw=hw*Math.cos(a)+hh*Math.sin(a),bh=hw*Math.sin(a)+hh*Math.cos(a);
    // مركز الفتحة بعد الدوران
    const oy=-c.h/2+26+hh;const rx=cx-oy*Math.sin(c.r*Math.PI/180),ry=c.y+c.h/2+oy*Math.cos(c.r*Math.PI/180);
    slots.push([rx-bw,ry-bh,2*bw,2*bh]);
  }
  if(sq){await brandLogo(ctx,g,W/2,60,52);text(ctx,t.tags[g.v%5],W/2,H-100,'60px Ruqaa',p.accent);}
  else{const x=W-cards[0].w-70-60;
    await brandLogo(ctx,g,x/2+30,story?260:150,46);
    const ty=story?560:400;
    for(const [k,[a,b]] of [['العيادة',t.brand],['النتيجة',t.tags[g.v%5]]].entries()){
      text(ctx,a,x/2+30,ty+k*(story?360:280),'800 24px Almarai',p.gold);
      text(ctx,b,x/2+30,ty+k*(story?360:280)+64,'52px Ruqaa',p.ink);
    }
    star(ctx,x/2+30,ty+(story?720:560),16,p.gold);}
  return {slots,masks:null,baked:true};
}};
// ٧ كروت مايلة بظل كرت ثاني
F.cards={name:'كروت',async draw(ctx,g){const {W,H,p,t}=g;
  const gr=ctx.createLinearGradient(0,0,W,H);gr.addColorStop(0,p.dark?p.bg:p.accent2);gr.addColorStop(1,p.dark?p.paper:p.accent);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=3;for(let i=-H;i<W;i+=70){ctx.beginPath();ctx.moveTo(i,H);ctx.lineTo(i+H*0.6,0);ctx.stroke();}
  const story=g.fmt==='story',sq=g.fmt==='square';
  const cw=400,ch=sq?560:story?820:660,cy=sq?240:story?470:300;
  const cards=[{x:575,y:cy,r:4},{x:105,y:cy,r:-4}];const slots=[];
  for(const [i,c] of cards.entries()){
    ctx.save();ctx.translate(c.x+cw/2,c.y+ch/2);
    ctx.save();ctx.rotate((c.r+6*(i?-1:1))*Math.PI/180);ctx.fillStyle='rgba(255,255,255,0.28)';ctx.beginPath();ctx.roundRect(-cw/2,-ch/2,cw,ch,34);ctx.fill();ctx.restore();
    ctx.rotate(c.r*Math.PI/180);
    shadowFill(ctx,()=>{ctx.beginPath();ctx.roundRect(-cw/2,-ch/2,cw,ch,34);},'rgba(0,0,0,0.3)',40,16,'#FFFFFF');
    ctx.save();ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';ctx.beginPath();ctx.roundRect(-cw/2+18,-ch/2+18,cw-36,ch-36,22);ctx.fill();ctx.restore();
    ctx.restore();
    const a=Math.abs(c.r*Math.PI/180),hw=(cw-36)/2,hh=(ch-36)/2;const bw=hw*Math.cos(a)+hh*Math.sin(a),bh=hw*Math.sin(a)+hh*Math.cos(a);
    slots.push([c.x+cw/2-bw,c.y+ch/2-bh,2*bw,2*bh]);
    latin(ctx,'',0,0,'',p.ink);
    text(ctx,i===0?'قبل':'بعد',c.x+cw/2,cy+ch+70,'800 40px Almarai','#FFFFFF');
  }
  await logo(ctx,g.sec==='dental'?'logo_reversed.png':'beauty_reversed.png',W/2,story?130:sq?36:50,sq?100:120);
  text(ctx,t.tags[(g.v+1)%5],W/2,H-(story?230:sq?70:110),'64px Ruqaa',p.dark?p.gold:'#FFF1E6');
  star(ctx,90,cy-40,16,'rgba(255,255,255,0.8)');star(ctx,W-80,cy+ch+20,12,'rgba(255,255,255,0.7)');
  // اللوغو بالوضع الفاتح لازم يكون أبيض على الأحمر
  return {slots,masks:null,baked:true};
},whiteLogo:true};
// ٨ شكل سن / قطرة متراكبين
F.shape={name:'أشكال',async draw(ctx,g){const {W,H,p,t,sec}=g;
  bgFill(ctx,W,H,p);
  const story=g.fmt==='story',sq=g.fmt==='square';
  const sh=TXT[sec].shape;
  const w=sq?450:story?600:540,h=sq?480:story?720:580;

    text(ctx,i===0?'قبل':'بعد',tx+tw/2,ty+th/2+4,'48px Ruqaa',p.accent2);
  }
  await brandLogo(ctx,g,W/2,story?150:sq?28:40,sq?44:50);
  const by=cy+ch+(H-cy-ch)/2;
  text(ctx,'قبل وبعد',W/2,by-30,`${sq?70:96}px Ruqaa`,p.dark?p.ink:p.accent2);
  ctx.fillStyle=p.dark?p.accent2:p.accent2;ctx.beginPath();ctx.roundRect(W/2-250,by+28,500,62,31);ctx.fill();
  text(ctx,t.tags[(g.v+4)%5],W/2,by+60,'800 28px Almarai','#FFFFFF');
  return {slots:[r,l],masks:[{radius:38},{radius:38}],baked:true,background:true};
}};
// ١٨ بانوراما: بعد كبيرة تذوب فوق لوح زجاجي بيه قبل
F.pano={name:'بانوراما',async draw(ctx,g){const {W,H,p,t}=g;

  ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(panel.x,panel.y,panel.w,panel.h,30);ctx.stroke();
  const sh=ctx.createLinearGradient(panel.x,panel.y,panel.x+panel.w,panel.y+panel.h);sh.addColorStop(0,'rgba(255,255,255,0.28)');sh.addColorStop(0.35,'rgba(255,255,255,0)');ctx.fillStyle=sh;ctx.beginPath();ctx.roundRect(panel.x,panel.y,panel.w,panel.h,30);ctx.fill();

  // كبسولات زجاج تحت
  const py=H-(sq?80:story?200:110);

    if(k===1){const sy=await img(p.sym);const s2=50,w2=sy.width*s2/sy.height;ctx.drawImage(sy,x-w2/2,py-s2/2,w2,s2);}else{star(ctx,x-50,py,14,p.gold);text(ctx,k===0?'بعد':'قبل',x+16,py+2,'800 30px Almarai',p.dark?p.ink:p.ink);}}
  return {slots:[[panel.x,panel.y,panel.w,panel.h],[after.x,after.y,after.w,after.h]],masks:[{radius:30},{feather:30,fadeFrom:[0,1],fadeTo:[0,0.2],fadeStart:0,fadeEnd:0.5}],baked:true,background:true};
}};
