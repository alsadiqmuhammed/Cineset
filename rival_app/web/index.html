<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="أرشيف عيادة ريڤال: المراجعين والحالات والمواعيد والحسابات والتقارير.">
  <meta name="theme-color" content="#D33C1A">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ريڤال">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>عيادة ريڤال</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: linear-gradient(180deg, #FCF7F2, #F2E2D6); }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: sans-serif; color: #6B5F57; transition: opacity .4s; }
    #splash img { width: 96px; height: 96px; animation: breathe 1.6s ease-in-out infinite; }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(211,60,26,.15); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #D33C1A; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.06); } }
    @keyframes slide { from { transform: translateX(150%); } to { transform: translateX(-250%); } }
    @media (prefers-color-scheme: dark) { html, body { background: #1C1918; } #splash { color: #B3A79F; } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 450); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
