<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINESET Invite</title><link rel="stylesheet" href="/style.css"></head><body><div class="login"><div class="loginbox card"><div class="eyebrow">CINESET</div><div class="heroLogo">Join project workspace</div><div id="inviteInfo" class="notice">Loading invite…</div><form id="inviteForm" hidden><div class="field"><label>Your name</label><input id="name" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required></div><button class="btn primary full" type="submit">Create client account</button></form></div></div><script>const token=location.pathname.split('/').filter(Boolean).pop();const info=document.querySelector('#inviteInfo'),form=document.querySelector('#inviteForm');(async()=>{try{const r=await fetch('/api/invites/'+token);const d=await r.json();if(!r.ok)throw Error(d.error||'Invite unavailable');info.innerHTML='Invited by <b>'+d.ownerName+'</b><br>Email: '+d.email;form.hidden=false;form.onsubmit=async e=>{e.preventDefault();const rr=await fetch('/api/invites/'+token+'/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value,password:document.querySelector('#password').value})});const x=await rr.json();if(!rr.ok)return alert(x.error||'Could not create account');location.href='/';}}catch(e){info.className='notice error';info.textContent=e.message}})();</script></body></html>
